name: Rust

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned toolchain
        run: rustup show
      - name: Install elan
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Build the Lean oracle
        run: cd formal && lake build oracle
      - name: Formatting
        run: cargo fmt --all --check
      - name: Lints
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Debug tests
        run: cargo test --workspace
      - name: Release tests
        run: cargo test --workspace --release
      - name: Kernel against the Lean model
        env:
          ONTOGRAPHY_REQUIRE_LEAN_ORACLE: "1"
        run: cargo test --test lean_oracle
