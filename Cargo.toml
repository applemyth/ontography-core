[workspace]
members = ["crates/*"]
exclude = ["vendor/iroh-blobs"]
default-members = [".", "crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
license = "MIT"
# Cargo's registry packaging drops dependency paths. Keep registry publication
# disabled until upstream includes our vendored cleanup fix and collector export.
publish = false
repository = "https://github.com/applemyth/ontography"

[workspace.dependencies]
ontography-calculus = { path = "crates/calculus" }
ontography-content = { path = "crates/content" }
ontography-runtime = { path = "crates/runtime" }
ontography-workspace = { path = "crates/workspace" }
ontography-application = { path = "crates/application" }
bao-tree = { version = "0.16.1", features = ["validate"] }
bytes = "1"
futures-lite = "2.6"
reflink-copy = "0.1.30"
iroh-blobs = { version = "=0.103.0", path = "vendor/iroh-blobs", default-features = false, features = ["fs-store"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.228", features = ["derive", "rc"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
tempfile = "3"
thiserror = "2.0.19"
tokio = { version = "1", features = ["fs", "io-util", "macros", "process", "rt-multi-thread", "sync", "time"] }
uuid = { version = "1", features = ["v4", "serde"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
needless_pass_by_value = "allow"
should_implement_trait = "allow"
struct_field_names = "allow"
too_many_lines = "allow"

[package]
name = "ontography-core"
description = "Authority-governed workflow occurrence graphs"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
include = [
    "/src/**",
    "/tests/**",
    "/README.md",
    "/MATHEMATICAL_DEFINITION.md",
    "/docs/**",
    "/LICENSE",
    "/Cargo.toml",
    "/Cargo.lock",
    "/rust-toolchain.toml",
]

[lib]
name = "ontography"

[dependencies]
ontography-application.workspace = true
ontography-calculus.workspace = true
ontography-content.workspace = true
ontography-runtime.workspace = true
ontography-workspace.workspace = true

[dev-dependencies]
rusqlite.workspace = true
serde_json.workspace = true
tempfile.workspace = true
tokio.workspace = true

[lints]
workspace = true
