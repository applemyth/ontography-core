[package]
name = "ontography-core"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
description = "Authority-governed workflow occurrence graphs"
license = "MIT"
# Cargo's registry packaging drops dependency paths. Keep registry publication
# disabled until upstream includes our vendored cleanup fix and collector export.
publish = false
repository = "https://github.com/applemyth/ontography"
include = [
    "/src/**",
    "/tests/**",
    "/README.md",
    "/MATHEMATICAL_DEFINITION.md",
    "/docs/**",
    "/LICENSE",
    "/Cargo.toml",
    "/Cargo.lock",
    "/rust-toolchain.toml",
]

[dependencies]
bao-tree = { version = "0.16.1", features = ["validate"] }
bytes = "1"
futures-lite = "2.6"
reflink-copy = "0.1.30"
iroh = { version = "1.2.0", default-features = false, features = ["tls-ring"] }
iroh-blobs = { version = "=0.103.0", path = "vendor/iroh-blobs", default-features = false, features = ["fs-store"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.228", features = ["derive", "rc"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
thiserror = "2.0.19"
tokio = { version = "1", features = ["fs", "io-util", "macros", "process", "rt-multi-thread", "sync", "time"] }
uuid = { version = "1", features = ["v4", "serde"] }

[lib]
name = "ontography"

[dev-dependencies]
tempfile = "3"

[workspace]
members = []
exclude = ["vendor/iroh-blobs"]
default-members = ["."]
resolver = "3"

[lints]
workspace = true

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
needless_pass_by_value = "allow"
should_implement_trait = "allow"
struct_field_names = "allow"
too_many_lines = "allow"
